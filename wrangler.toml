# Cloudflare Pages (Wrangler config)
# Use a Hugo version compatible with templates that reference `hugo.IsMultilingual`.
pages_build_output_dir = "public"

[build]
command = "curl -L https://github.com/gohugoio/hugo/releases/download/v0.153.0/hugo_extended_0.153.0_linux-amd64.tar.gz | tar -xz && ./hugo --gc --minify"
